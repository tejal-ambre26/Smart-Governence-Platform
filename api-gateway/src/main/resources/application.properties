# Legacy prefix routes (kept for backward compatibility)
spring.cloud.gateway.server.webmvc.routes[4].id=citizen-service
spring.cloud.gateway.server.webmvc.routes[4].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/citizen-service/**
