version: '3.8'

services:
  # ── 1. Database ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: civicpulse-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicpulse_db}
      POSTGRES_USER: ${POSTGRES_USER:-civicpulse_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicpulse_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Kafka & Zookeeper ──────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: civicpulse-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: civicpulse-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ── 3. Keycloak IAM ────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: civicpulse-keycloak
    restart: always
    command: start-dev --http-port=8180
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-civicpulse_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-civicpulse_admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8180:8180"
    depends_on:
      postgres:
        condition: service_healthy

  # ── 4. Service Discovery ───────────────────────────────────────────────────
  eureka-server:
    build:
      context: ./eureka-server
    container_name: civicpulse-eureka
    restart: always
    ports:
      - "8761:8761"

  # ── 5. Microservices ───────────────────────────────────────────────────────
  user-service:
    build:
      context: ./user-service
    container_name: civicpulse-user-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-civicpulse_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-civicpulse_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - postgres

  citizen-service:
    build:
      context: ./citizen-service
    container_name: civicpulse-citizen-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-civicpulse_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-civicpulse_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - postgres

  grievance-service:
    build:
      context: ./grievance-service
    container_name: civicpulse-grievance-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-civicpulse_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-civicpulse_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - postgres
      - kafka

  service-management-service:
    build:
      context: ./service-management-service
    container_name: civicpulse-service-management
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-civicpulse_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-civicpulse_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - postgres

  welfare-service:
    build:
      context: ./welfare-service
    container_name: civicpulse-welfare-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-civicpulse_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-civicpulse_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - postgres
      - kafka

  notification-service:
    build:
      context: ./notification-service
    container_name: civicpulse-notification-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-civicpulse_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-civicpulse_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - postgres
      - kafka

  reporting-service:
    build:
      context: ./reporting-service
    container_name: civicpulse-reporting-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-civicpulse_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-civicpulse_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - postgres

  # ── 6. API Gateway ────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
    container_name: civicpulse-api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8180/realms/civicpulse}
    depends_on:
      - eureka-server
      - keycloak

  # ── 7. React Production Frontend ───────────────────────────────────────────
  citizen-frontend:
    build:
      context: ./citizen-frontend
    container_name: civicpulse-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
